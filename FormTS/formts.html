<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Student Registration Form</title>
 <style>
 body { font-family: Arial, sans-serif; background: #f4f6f8; }
 form { max-width: 480px; margin: 20px auto; padding: 24px; background: #ffffff;
border-radius: 8px; }
 h1, h2 { text-align: center; }
 .form-group { margin-bottom: 16px; }
 .form-group > label { display: block; font-weight: bold; margin-bottom: 6px; }
 input[type="text"], input[type="password"], input[type="number"],
input[type="time"], textarea {
 width: 100%; padding: 8px; box-sizing: border-box;
 }
 .options label { display: inline-block; margin-right: 12px; }
 .error { display: block; color: red; font-size: 0.85em; margin-top: 4px; }
 .buttons { text-align: center; }
 #feedback { max-width: 480px; margin: 16px auto; font-weight: bold; }
 </style>

 <link rel="stylesheet" href="formts.css">
 
</head>
<body>
<h1>Student Registration Form</h1>
<form id="registrationForm">
 <div class="form-group">
 <label for="fullName">Full Name:</label>
 <input type="text" id="fullName" name="fullName" placeholder="Enter student's
full name">
 <small class="error" id="fullNameError"></small>
 </div>
 <div class="form-group">
 <label>Gender:</label>
 <div class="options">
 <label><input type="radio" name="gender" value="Male"> Male</label>
 <label><input type="radio" name="gender" value="Female"> Female</label>
 </div>
 <small class="error" id="genderError"></small>
 </div>
 <div class="form-group">
 <label>School Level:</label>
 <div class="options">
 <label><input type="radio" name="schoolLevel" value="Kindergarten">
Kindergarten</label>
 <label><input type="radio" name="schoolLevel" value="Elementary">
Elementary</label>
 <label><input type="radio" name="schoolLevel" value="Junior High"> Junior
High</label>
 <label><input type="radio" name="schoolLevel" value="Senior High"> Senior
High</label>
 </div>
 <small class="error" id="schoolLevelError"></small>
 </div>
 <div class="form-group">
 <label for="schoolName">School Name:</label>
 <input type="text" id="schoolName" name="schoolName" placeholder="Enter current
school name">
 <small class="error" id="schoolNameError"></small>
 </div>
 <div class="form-group">
 <label for="address">Full Address:</label>
 <textarea id="address" name="address" rows="3" placeholder="Enter complete home
address"></textarea>
 <small class="error" id="addressError"></small>
 </div>
 <div class="form-group">
 <label for="parentName">Parent's Name:</label>
 <input type="text" id="parentName" name="parentName" placeholder="Enter parent's
full name">
 <small class="error" id="parentNameError"></small>
 </div>
 <div class="form-group">
 <label for="phoneNumber">Phone Number:</label>
 <input type="number" id="phoneNumber" name="phoneNumber" placeholder="e.g.
081234567890">
 <small class="error" id="phoneNumberError"></small>
 </div>
 <div class="form-group">
 <label for="schedule">Tutoring Schedule:</label>
 <input type="time" id="schedule" name="schedule">
 <small class="error" id="scheduleError"></small>
 </div>
 <div class="form-group">
 <label>Select Tutoring Program:</label>
 <div class="options">
 <label><input type="checkbox" class="program" value="Mathematics">
Mathematics</label>
 <label><input type="checkbox" class="program" value="English"> English</label>
 <label><input type="checkbox" class="program" value="Dance"> Traditional
Dance</label>
 <label><input type="checkbox" class="program" value="School Subject"> School
Subjects</label>
 </div>
 <small class="error" id="programError"></small>
 </div>
 <div class="buttons">
 <button type="submit">Submit</button>
 <button type="reset">Cancel</button>
 </div>
</form>
<p id="feedback"></p>
<script type="module" src="formts.js"></script>
</body>
</html>
