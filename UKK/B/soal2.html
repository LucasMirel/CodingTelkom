<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <!-- jadi kan ada bengkel noh -->
    <!-- nah kita perlu mencatat data gaji nya dan juga nama pegawai bengkelnya -->
    <!-- jadi kita perlu menghitung gaji dan menambahkan datanya ke dalam arraynya -->
    <!-- rumus gaji = jam kerja x upah perjam -->
    <!-- cara nyimpen data = pake array -->

    <!-- nah buat dlu elemen htmlnya -->
    <!-- yang kita perluin yaitu : -->
    <!-- 3 input : pekerja (nama), jamkerja (angka), upahjam (angka) -->
    <!-- 1 button simpan dan hasilnya -->

    <label>Masukkan nama:</label>
    <input type="text" required placeholder="Masukkan Nama" id="inputNamaPekerja">
    <br><br>

    <label>Masukkan jam kerja:</label>
    <input type="number" required placeholder="Masukkan Jam Kerja" id="inputJamKerja">
    <br><br>

    <label>Masukkan upah kerja:</label>
    <input type="text" required placeholder="Masukkan Nama" id="inputUpahKerja">
    <br><br>

    <button id="buttonSimpan">Simpan</button>

    <p id="output">

    </p>

    <p>Hasil pengeluaran total: <b id="hasilAkhir"></b></p>

</body>
