<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BBMNoteTaker</title>
</head>
<body>
    <h1>Welcome to the BBM NotesWeb!</h1>

    <br><br>
    <p>Enter Vehicle Name:</p>
    <input type="text" id="Vehicle" placeholder="Vehicle Name">

    <br><br>
    <p>Enter Location Distance (KM)</p>
    <input type="number" id="Length" placeholder="Destination Distance">

    <br><br>
    <p>Enter Fuel Consumption (per liter)</p>
    <input type="number" id="Consumption" placeholder="BBM Consumption">

    <br><br>
    <button id="Save">Data Save</button>

    <p id="result">
    </p>

    <p id="display"></p>

    <script src="problem2.js"></script>
</body>
</html>
