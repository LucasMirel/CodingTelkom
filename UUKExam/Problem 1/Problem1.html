<!-- Problem 1: A weather station wanted to know the average temperature for the day from a city and converting it to Fahrenheit.-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Friend</title>
</head>
<body>
    <h1>Welcome to the weather friend website!</h1>

    <br><br>
    <p>Enter the name of the city:</p>
    <input type="text" id="cityName" placeholder="City name">

    <br><br>
    <p>Enter two different temperature in Celsius between 2 different times for the day:</p>
    <label for="celsiusInputMorning">Morning Temperature:</label>
        <input type="number" id="celsiusInputMorning" placeholder="Temperature in Celsius">
    
    <br><br>
    <label for="celsiusInputEvening">Evening Temperature:</label>
        <input type="number" id="celsiusInputEvening" placeholder="Temperature in Celsius">
    
    <br><br>
    <button id="calculate">Calculate Temperature</button>
    <label id="display"></label>

    <div id="output">

    </div>

    <script src="Problem1.js"></script>
</body>
</html>
