<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>
    <form action="" method="post">
        <input type="number" id="num1" placeholder="Enter first number"><br><br>
        <input type="number" id="num2" placeholder="Enter second number"><br><br>
        <button type="button" id="btnAdd" style="background-color: #01bbff;">Add(+)</button>
        <button type="button" id="btnSubtract" style="background-color: #ff6b6b;">Subtract(-)</button>
        <button type="button" id="btnMultiply" style="background-color: #4ecdc4;">Multiply(x)</button>
        <button type="button" id="btnDivide" style="background-color: #45b7d1;">Divide(÷)</button>

        <h2 id="result"></h2>
    </form>
    <script type="module" src="calculator.js"></script>
</body>
</html>
